server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudnotes
    static_configs:
      - targets: [localhost]
        labels:
          app: cloudnotes # a stable label. request_id stays a JSON field, not a label.
          __path__: /var/log/cloudnotes/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
