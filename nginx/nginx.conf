# Web tier: nginx reverse proxy, the single public entry point for CloudNotes.
server {
    listen 80;
    server_name _;

    server_tokens off;               # don't advertise the nginx version
    client_max_body_size 5m;         # matches the app's upload limit

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Only the HTTP methods CloudNotes actually uses
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }

    # Admin/monitoring endpoint: restricted, NOT open to everyone.
    # Only the local machine / private Docker networks may call it; the public gets 403.
    location = /health {
        allow 127.0.0.1;
        allow 172.16.0.0/12;         # Docker bridge networks (incl. Docker Desktop host gateway)
        allow 192.168.65.0/24;       # Docker Desktop (Mac/Windows) host network
        deny  all;
        proxy_pass http://app:5000;
    }

    location / {
        proxy_pass http://app:5000;  # forward to the private app tier
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
