# CloudNotes: tiered, least-privilege network (LU 2.4)
#
#   Internet ──80──▶ [web tier: nginx] ──5000──▶ [app tier: gunicorn/Flask] ──5432──▶ [db tier: PostgreSQL]
#                     network: web               networks: web + data                  network: data (internal)
#
# Default-deny: a container port is unreachable from outside unless it is listed under `ports:`.
# Only nginx publishes a port (80). The app (5000) and database (5432) publish NOTHING.
#
#   cp .env.example .env   # then edit values
#   docker compose up -d --build
services:
  web:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"                      # the ONE public door (HTTP). Nothing else is published.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web                          # web tier: can reach the app, can NOT reach the database
    depends_on:
      - app

  app:
    build: .
    restart: always
    env_file: .env
    environment:
      # Connection string comes ONLY from .env (no credentials in code or in this file).
      # Repointing the app to another database = changing this one variable.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (run migration/00-prepare.sh)}
      UPLOAD_FOLDER: /app/uploads
    expose:
      - "5000"                       # reachable ONLY by containers on its networks (nginx), not the host/public
    networks:
      - web                          # receives traffic from nginx
      - data                         # the only tier allowed to talk to the database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: cloudnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # NO `ports:` -> 5432 is never published to the host or the internet.
    networks:
      - data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes"]
      interval: 5s
      retries: 10

  # Migration TARGET (LU 2.7): a fresh, newer PostgreSQL. Same private `data` network, no published port.
  db-target:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: cloudnotes
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:?set TARGET_DB_PASSWORD in .env (run migration/00-prepare.sh)}
    networks:
      - data
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes"]
      interval: 5s
      retries: 10

networks:
  web:                               # web tier <-> app tier
  data:
    internal: true                   # db tier: no route to/from the outside world (no ingress, no internet egress)

volumes:
  pgdata:       # source database (PostgreSQL 16), kept intact as the rollback
  pgdata17:     # target database (PostgreSQL 17)
  uploads:
