name: CloudNotes CI/CD

on: push

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudnotes

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the CloudNotes tests
        run: python -m pytest -v

  build-and-push:
    name: Build and push image
    needs: test # runs only if the tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Push the image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  prepare-deployment:
    name: Update deployment manifest
    needs: build-and-push # runs only after the image is published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Point the manifest at the new image
        run: |
          sed -i "s|image: .*cloudnotes:.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml

      - name: Commit the updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: deploy image ${GITHUB_SHA} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Deploy step, run by hand because GitHub's runner cannot reach a local cluster:
      #   git pull && kubectl apply -f k8s/deployment.yaml
