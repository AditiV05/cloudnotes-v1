global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client  5s
    timeout server  3s
    retries 1
    option redispatch               # a failed connect may be retried on the other replica

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 1s                   # re-resolve so a restarted replica is found again

frontend cloudnotes
    bind *:8080
    default_backend notes_api

backend notes_api
    balance roundrobin
    option httpchk GET /health      # readiness: app can read the notes table
    http-check expect status 200
    option log-health-checks        # log UP/DOWN transitions
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server app1 app1:5000 check
    server app2 app2:5000 check
